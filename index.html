<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitBloom">
<title>FitBloom</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F12; --card:#17181C; --card2:#1F2026; --line:#2A2C33;
  --text:#F3F3F5; --steel:#8B909A;
  --accent:#FF4D8D; --accent-ink:#1A0610; --accent-soft:rgba(255,77,141,.14);
  --tag:#1E2A44; --tag-ink:#AFC6FF;
  --good:#4CD39A;
  --display:"Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body:"Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0; background:var(--bg)}
body{color:var(--text); font-family:var(--body); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button,input{font:inherit; color:inherit}
button{background:none; border:0; padding:0; cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2{font-family:var(--display); font-weight:400; margin:0; letter-spacing:.02em; line-height:1}
p{margin:0}

.app{max-width:520px; margin:0 auto; padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}
.top{display:flex; align-items:center; justify-content:space-between; padding:14px 0 12px; border-bottom:1px solid var(--line); margin-bottom:14px}
.logo{font-family:var(--display); font-size:26px; letter-spacing:.03em}
.logo span{color:var(--accent)}
.top-r{display:flex; gap:10px; align-items:center}
.date{font-family:var(--mono); font-size:12px; color:var(--steel)}
.install{background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:12px; padding:6px 10px; border-radius:8px}

.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px}
.eyebrow{font-size:12px; color:var(--steel); letter-spacing:.08em; text-transform:uppercase}
.big{font-size:40px; margin:4px 0 10px}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.tag{background:var(--tag); color:var(--tag-ink); font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px}
.tip{background:var(--card2); border-radius:10px; padding:11px 12px; margin-bottom:12px}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px; border-radius:10px; font-weight:700; text-align:center}
.btn + .btn{margin-top:8px}
.btn-a{background:var(--accent); color:var(--accent-ink)}
.btn-b{background:var(--card2); border:1px solid var(--line)}
.btn-ok{background:rgba(76,211,154,.14); color:var(--good); border:1px solid rgba(76,211,154,.3)}
.btn svg{width:18px; height:18px}

.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0}
.stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 6px; text-align:center}
.stat b{display:block; font-family:var(--display); font-size:30px; font-weight:400; line-height:1}
.stat b small{font-size:16px; color:var(--steel)}
.stat span{font-size:12px; color:var(--steel)}
.stat.hot b{color:var(--accent)}

.label{font-size:14px; color:var(--steel); margin:16px 0 8px}
.wk{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.wk div{text-align:center; font-size:11px; color:var(--steel)}
.wk i{display:block; height:30px; border-radius:7px; background:var(--card2); margin-top:5px; border:1px solid var(--line)}
.wk .done i{background:var(--accent); border-color:var(--accent)}
.wk .now i{border:2px solid var(--accent)}
.wk .off i{opacity:.4}

.ios{background:var(--accent-soft); border:1px solid rgba(255,77,141,.35); border-radius:12px; padding:12px; margin-bottom:12px; font-size:14px; display:flex; gap:10px; align-items:flex-start}
.ios button{margin-left:auto; color:var(--steel); font-size:18px; line-height:1}

/* workout list */
.back{display:inline-flex; align-items:center; gap:4px; color:var(--steel); font-weight:600; padding:6px 0; margin-bottom:6px}
.back svg{width:18px; height:18px}
.sub{color:var(--steel); margin:6px 0 14px}
.exl{display:flex; flex-direction:column; gap:8px}
.exc{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px 8px 8px}
.exc.done{opacity:.55}
.exc .open{flex:1; display:flex; align-items:center; gap:12px; text-align:left; min-width:0}
.thumb{flex:none; width:72px; height:54px; background:var(--card2); border-radius:8px}
.thumb svg{width:100%; height:100%}
.exc .nm{font-weight:700; display:block}
.exc.done .nm{text-decoration:line-through}
.exc .ds{font-size:13px; color:var(--steel)}
.tick{flex:none; width:40px; height:40px; display:grid; place-items:center}
.tick span{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center}
.tick svg{width:14px; height:14px; opacity:0}
.exc.done .tick span{background:var(--accent); border-color:var(--accent)}
.exc.done .tick svg{opacity:1; color:var(--accent-ink)}

/* exercise page */
.stage{background:#F6F4F5; border-radius:14px; overflow:hidden; position:relative}
.stage svg{display:block; width:100%; height:auto}
.stage .vn{position:absolute; top:10px; left:12px; font-size:11px; font-weight:700; color:#6B6170; letter-spacing:.06em; text-transform:uppercase}
.stage .legend{position:absolute; top:10px; right:12px; font-size:11px; font-weight:700; color:#D61F65; display:flex; align-items:center; gap:5px}
.stage .legend i{width:9px; height:9px; border-radius:50%; background:#FF4D8D; box-shadow:0 0 6px #FF4D8D}
.exh{font-size:38px; margin:14px 0 8px}
.dose{display:inline-block; font-family:var(--mono); font-size:13px; background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:4px 9px; margin-bottom:10px}
.how{list-style:none; margin:4px 0 14px; padding:0; counter-reset:n}
.how li{position:relative; padding:0 0 10px 34px}
.how li::before{counter-increment:n; content:counter(n); position:absolute; left:0; top:0; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13px; display:grid; place-items:center}
.note{background:var(--card2); border-left:3px solid var(--accent); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:14px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px}
.row2 .btn + .btn{margin-top:0}
.pager{display:flex; justify-content:space-between; margin-top:12px}
.pager button{color:var(--steel); font-weight:600; padding:8px 0; display:flex; align-items:center; gap:4px}
.pager svg{width:18px; height:18px}

/* week */
.wrow{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px}
.wrow.now{border-color:var(--accent)}
.wrow .d{width:40px; font-family:var(--mono); font-size:12px; color:var(--steel)}
.wrow .t{flex:1; font-family:var(--display); font-size:22px; line-height:1.05}
.wrow .n{font-size:12px; color:var(--steel)}
.wrow svg{width:18px; height:18px; color:var(--steel)}
.wrow.rest{opacity:.55}

/* weight */
.wform{display:flex; gap:8px}
.wform input{flex:1; min-width:0; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:13px 12px; font-size:18px; font-family:var(--mono)}
.wform .btn{width:auto; padding:13px 20px}
.chart{margin-top:12px}
.chart svg{display:block; width:100%; height:auto}
.hist{list-style:none; margin:0; padding:0}
.hist li{display:flex; align-items:center; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .hd{color:var(--steel); font-size:13px}
.hist .hk{font-family:var(--mono)}
.hist button{color:var(--steel); padding:4px 8px; font-size:18px}
.empty{color:var(--steel); text-align:center; padding:18px 8px}
.up{color:var(--accent)} .down{color:var(--good)}

/* nav */
.nav{position:fixed; left:0; right:0; bottom:0; background:#121317; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:5}
.nav-in{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr)}
.nav button{display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 10px; font-size:11px; font-weight:600; color:var(--steel)}
.nav svg{width:22px; height:22px}
.nav button[aria-current="page"]{color:var(--accent)}

/* timer */
.timer{position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); text-align:center}
.timer[hidden]{display:none}
.timer .tl{font-family:var(--display); font-size:26px; color:var(--steel); margin-bottom:16px}
.tring{width:min(72vw,290px); aspect-ratio:1; position:relative}
.tring svg{width:100%; height:100%; transform:rotate(-90deg)}
.tring .num{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--display); font-size:clamp(64px,22vw,96px)}
.timer .msg{color:var(--accent); font-weight:700; min-height:22px; margin-top:12px}
.tb{display:flex; gap:8px; width:100%; max-width:360px; margin-top:18px}
.tb button{flex:1; padding:15px; border-radius:10px; font-weight:700; background:var(--card2); border:1px solid var(--line)}
.tb button.p{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" aria-label="Main"><div class="nav-in" id="nav"></div></nav>
<div class="timer" id="timer" hidden role="dialog" aria-modal="true" aria-label="Timer"></div>

<script>
(function(){
"use strict";

/* ===== Figure poses =====
   P(hip, neck, nearHand, farHand, nearFoot, farFoot). The figure's elbows and knees are worked out automatically.
   Ground is at y = 140. */
function P(hip,neck,h0,h1,f0,f1){ return {hip:hip, neck:neck, h:[h0,h1], f:[f0,f1]}; }
var BR_A = P([110,131],[66,131],[108,135],[108,135],[142,137],[142,137]);
var BR_B = P([104,108],[66,131],[106,135],[106,135],[142,137],[142,137]);
var QUAD = P([90,100],[140,98],[142,140],[138,140],[60,138],[56,138]);
var PLANK = P([96,110],[148,96],[150,138],[146,138],[40,134],[40,134]);
var WALK_A = P([110,77],[112,33],[98,74],[124,72],[126,140],[94,140]);
var WALK_B = P([110,77],[112,33],[124,72],[98,74],[94,140],[126,140]);

/* hl = parts that glow (glutes, legs, core, arms, back, shoulders, all) */
var EX = {
  glute_bridge:{name:"Glute bridge", works:["Glutes","Hamstrings"], hl:["glutes"], keys:[BR_A,BR_B],
    steps:["Lie on your back, knees bent, feet flat.","Push through your heels and lift your hips.","Squeeze your glutes at the top, then lower slowly."]},
  glute_bridge_squeeze:{name:"Glute bridge + squeeze", works:["Glutes","Hamstrings"], hl:["glutes"], keys:[BR_A,BR_B], hold:true,
    steps:["Lie on your back, knees bent, feet flat.","Lift your hips and hold for 2 seconds, squeezing hard.","Lower slowly and repeat."]},
  sl_glute_bridge:{name:"Single-leg glute bridge", works:["Glutes","Hamstrings"], hl:["glutes"],
    keys:[P([110,131],[66,131],[108,135],[108,135],[142,137],[159,90]), P([104,108],[66,131],[106,135],[106,135],[142,137],[166,91])],
    steps:["Lie on your back with one leg straight up.","Push through the other heel to lift your hips.","Keep your hips level. Finish one side, then switch."]},
  frog_pumps:{name:"Frog pumps", works:["Glutes"], hl:["glutes"],
    keys:[P([110,131],[66,131],[108,135],[108,135],[134,137],[134,137]), P([106,116],[66,131],[106,135],[106,135],[134,137],[134,137])],
    steps:["Lie on your back, soles of your feet together, knees out.","Squeeze your glutes to lift your hips.","Lower and repeat quickly but with control."]},
  bw_squat:{name:"Bodyweight squat", works:["Glutes","Thighs"], hl:["glutes","legs"],
    keys:[P([108,77],[110,33],[152,35],[152,35],[112,140],[108,140]), P([92,108],[117,72],[158,72],[158,72],[112,140],[108,140])],
    steps:["Stand with feet a little wider than your hips.","Sit your hips back and down, chest up.","Push through your feet to stand and squeeze your glutes."]},
  reverse_lunge:{name:"Reverse lunge", works:["Glutes","Thighs"], hl:["glutes","legs"],
    keys:[P([110,77],[110,33],[110,76],[110,76],[114,140],[108,140]), P([100,104],[101,60],[101,103],[101,103],[128,140],[66,140])],
    steps:["Stand tall, then step one foot back.","Lower until both knees bend to about 90\u00b0.","Push through your front foot to stand. Switch legs after each set."]},
  sl_rdl:{name:"Single-leg deadlift", works:["Hamstrings","Glutes"], hl:["glutes","legs"],
    keys:[P([110,77],[110,33],[110,76],[110,76],[110,140],[104,130]), P([106,82],[150,72],[150,114],[150,114],[110,140],[43,74])],
    steps:["Stand on one leg, knee slightly bent.","Lean forward from your hips as your other leg lifts behind you.","Keep your back flat, then squeeze your glute to stand. Hold a wall if needed."]},
  bulgarian:{name:"Bulgarian split squat", works:["Glutes","Thighs"], hl:["glutes","legs"], prop:"step",
    keys:[P([100,80],[102,36],[100,79],[100,79],[128,140],[48,112]), P([96,106],[106,63],[98,104],[98,104],[128,140],[48,112])],
    note:"Only use a low, stable step if it feels safe. Otherwise do reverse lunges.",
    steps:["Rest the top of your back foot on a low step.","Lower straight down until your front thigh is nearly level.","Push through your front heel to rise."]},
  donkey_kick:{name:"Donkey kick", works:["Glutes"], hl:["glutes"],
    keys:[QUAD, P([90,100],[140,98],[142,140],[138,140],[58,64],[56,138])],
    steps:["Start on hands and knees.","Keep your knee bent and lift that foot toward the ceiling.","Squeeze at the top. Don\u2019t arch your back."]},
  fire_hydrant:{name:"Fire hydrant", works:["Side glutes"], hl:["glutes"], view:"top", len:{ua:12,fa:12,th:24,sh:30}, kb:[1,-1], eb:[1,-1],
    keys:[P([120,100],[120,44],[100,42],[140,42],[104,140],[136,140]), P([120,100],[120,44],[100,42],[140,42],[68,118],[136,140])],
    steps:["Start on hands and knees.","Keeping the knee bent, lift one leg out to the side.","Lift only as high as you can without tipping, then lower."]},
  dead_bug:{name:"Dead bug", works:["Abs","Core"], hl:["core"],
    keys:[P([110,131],[66,131],[66,89],[68,89],[142,99],[142,99]), P([110,131],[66,131],[26,128],[68,89],[142,99],[172,124])],
    steps:["Lie on your back, arms up, knees bent above your hips.","Slowly lower one arm and the opposite leg.","Keep your lower back pressed down. Switch sides."]},
  forearm_plank:{name:"Forearm plank", works:["Abs","Core"], hl:["core"], hold:true,
    keys:[P([98,128],[150,116],[172,138],[168,138],[40,138],[40,138]), P([98,125],[150,116],[172,138],[168,138],[40,138],[40,138])],
    steps:["Elbows under your shoulders, body in a straight line.","Squeeze your glutes and pull your belly in.","Breathe steadily. On your knees is fine too."]},
  reverse_crunch:{name:"Reverse crunch", works:["Lower abs"], hl:["core"],
    keys:[P([110,131],[66,131],[104,136],[104,136],[152,128],[152,128]), P([104,122],[66,131],[100,136],[100,136],[110,80],[110,80])],
    steps:["Lie on your back, knees bent.","Curl your hips up, bringing your knees to your chest.","Lower slowly. Don\u2019t swing."]},
  knee_pushup:{name:"Knee push-up", works:["Chest","Arms"], hl:["arms","shoulders"],
    keys:[P([98,112],[148,92],[150,138],[146,138],[46,112],[46,112]), P([100,122],[148,116],[150,138],[146,138],[48,122],[48,122])],
    steps:["Hands under your shoulders, knees on the floor.","Lower your chest toward the floor.","Push back up, keeping your body straight."]},
  arm_circles:{name:"Arm circles", works:["Shoulders","Arms"], hl:["arms","shoulders"], view:"front",
    keys:[P([110,77],[110,33],[66,22],[154,22],[100,140],[120,140]), P([110,77],[110,33],[68,46],[152,46],[100,140],[120,140])],
    steps:["Stand tall with arms straight out to the sides.","Make small circles forward.","Switch direction halfway."]},
  shoulder_taps:{name:"Shoulder taps", works:["Core","Arms"], hl:["core","arms"],
    keys:[PLANK, P([96,110],[148,96],[150,138],[160,108],[40,134],[40,134])],
    steps:["Start in a plank on your hands (or knees).","Lift one hand and tap the opposite shoulder.","Keep your hips still. Alternate sides."]},
  brisk_walk:{name:"Brisk walk", works:["Heart","Legs"], hl:["legs"], keys:[WALK_A,WALK_B],
    steps:["Walk at a pace where you can talk but not sing.","Swing your arms naturally.","Indoors? March in place."]},
  side_steps:{name:"Side steps", works:["Hips","Legs"], hl:["legs"], view:"front",
    keys:[P([110,80],[110,36],[94,80],[126,80],[98,140],[122,140]), P([102,80],[102,36],[86,80],[118,80],[80,140],[122,140])],
    steps:["Stand with knees slightly bent.","Step to the side, then bring the other foot in.","Go a few steps each way at a steady pace."]},
  hip_flexor:{name:"Hip-flexor stretch", works:["Front of hips"], hl:["legs"], hold:true,
    keys:[P([100,108],[102,64],[128,104],[124,104],[140,140],[56,138]), P([106,110],[110,66],[132,106],[128,106],[140,140],[56,138])],
    steps:["Kneel on one knee, other foot in front.","Gently shift forward until you feel a stretch.","Hold, then switch sides."]},
  childs_pose:{name:"Child\u2019s pose", works:["Back","Hips"], hl:["back"], hold:true,
    keys:[P([76,108],[116,124],[158,138],[158,138],[68,138],[68,138]), P([76,106],[116,122],[158,138],[158,138],[68,138],[68,138])],
    steps:["Kneel and sit back toward your heels.","Reach your arms forward and rest your head down.","Relax and breathe slowly."]},
  full_stretch:{name:"Full-body stretch", works:["Whole body"], hl:["all"], view:"front",
    keys:[P([110,77],[110,33],[104,-8],[116,-8],[104,140],[116,140]), P([112,77],[98,36],[80,0],[88,-4],[104,140],[116,140])],
    steps:["Reach up tall, then lean gently to each side.","Stretch your legs and chest too.","Hold each stretch 20\u201330 seconds. No bouncing."]},
  bird_dog:{name:"Bird dog", works:["Core","Back"], hl:["core","back"],
    keys:[QUAD, P([90,100],[140,98],[142,140],[184,90],[28,96],[56,138])],
    steps:["Start on hands and knees.","Reach one arm forward and the opposite leg back.","Keep your hips level. Switch sides."]},
  side_plank_knees:{name:"Side plank (knees)", works:["Side abs"], hl:["core"], view:"front", kb:[1,1],
    keys:[P([88,134],[128,116],[150,138],[130,74],[30,138],[30,138]), P([90,120],[128,116],[150,138],[128,74],[30,138],[30,138])],
    steps:["Lie on your side, elbow under shoulder, knees bent.","Lift your hips into a straight line.","Hold, then switch sides."]},
  prone_w:{name:"Prone W raise", works:["Upper back"], hl:["back","shoulders"], view:"top", eb:[-1,1],
    keys:[P([120,84],[120,40],[94,34],[146,34],[113,152],[127,152]), P([120,84],[120,40],[100,44],[140,44],[113,152],[127,152])],
    steps:["Lie face down, arms bent in a W shape.","Squeeze your shoulder blades and lift your arms slightly.","Hold for a second, then lower."]},
  snow_angel:{name:"Reverse snow angel", works:["Upper back"], hl:["back","shoulders"], view:"top",
    keys:[P([120,84],[120,40],[100,92],[140,92],[113,152],[127,152]), P([120,84],[120,40],[76,46],[164,46],[113,152],[127,152]), P([120,84],[120,40],[98,-2],[142,-2],[113,152],[127,152])],
    steps:["Lie face down, arms by your sides, lifted slightly.","Sweep your arms out and over your head.","Sweep them back down. Move slowly."]},
  walking:{name:"Walk", works:["Heart","Legs"], hl:["legs"], keys:[WALK_A,WALK_B],
    steps:["Walk at an easy pace.","Somewhere pleasant if you can.","It should feel refreshing, not tiring."]},
  mobility:{name:"Gentle mobility", works:["Whole body"], hl:["all"], view:"front", eb:[1,-1],
    keys:[P([102,77],[110,33],[92,76],[112,76],[100,140],[120,140]), P([118,77],[110,33],[108,76],[128,76],[100,140],[120,140])],
    steps:["Hands on hips, make slow hip circles.","Roll your shoulders and gently stretch your neck.","Move slowly and comfortably."]}
};

/* ===== Weekly plan (0 = Sunday) ===== */
var PLAN = {
  1:{title:"Glutes & Hamstrings", tags:["Glutes","Hamstrings"], tip:"Slow reps and a strong squeeze at the top.", items:[
    {id:"glute_bridge", d:"4 \u00d7 15"},{id:"bw_squat", d:"3 \u00d7 12"},{id:"reverse_lunge", d:"3 \u00d7 10 each leg"},
    {id:"sl_glute_bridge", d:"2 \u00d7 10 each leg"},{id:"donkey_kick", d:"3 \u00d7 15 each leg"},{id:"fire_hydrant", d:"2 \u00d7 15 each leg"}]},

/* ===== Drawing the figure ===== */
var LEN = {ua:22, fa:20, th:32, sh:32};
function ik(a,b,L1,L2,sign){
  var dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy)||0.001, ux=dx/d, uy=dy/d;
  var dd=Math.max(Math.abs(L1-L2)+0.01, Math.min(d, L1+L2-0.01));
  var c=(L1*L1+dd*dd-L2*L2)/(2*L1*dd), A=Math.acos(Math.max(-1,Math.min(1,c)))*sign;
  var rx=ux*Math.cos(A)-uy*Math.sin(A), ry=ux*Math.sin(A)+uy*Math.cos(A);
  var j=[a[0]+rx*L1, a[1]+ry*L1];
  var ex=b[0]-j[0], ey=b[1]-j[1], e=Math.hypot(ex,ey)||0.001;
  return [j,[j[0]+ex/e*L2, j[1]+ey/e*L2]];
}
function lerp(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
function mix(p,q,t){ return {hip:lerp(p.hip,q.hip,t), neck:lerp(p.neck,q.neck,t), h:[lerp(p.h[0],q.h[0],t),lerp(p.h[1],q.h[1],t)], f:[lerp(p.f[0],q.f[0],t),lerp(p.f[1],q.f[1],t)]}; }
function poseAt(ex,s){
  var k=ex.keys; if(k.length===2) return mix(k[0],k[1],s);
  return s<0.5 ? mix(k[0],k[1],s*2) : mix(k[1],k[2],(s-0.5)*2);
}
function ln(a,b,w,c,extra){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"'+(extra||'')+'/>'; }
var INK="#2A2730", FAR="#A49DAA", GLOW="#FF4D8D";
function figure(ex,pose){
  var L=ex.len||LEN, kb=ex.kb||[-1,-1], eb=ex.eb||[1,1], hl=ex.hl||[], side=!ex.view;
  var all=hl.indexOf("all")>=0;
  function on(p){ return all || hl.indexOf(p)>=0; }
  var hip=pose.hip, nk=pose.neck;
  var tx=nk[0]-hip[0], ty=nk[1]-hip[1], tl=Math.hypot(tx,ty)||1;
  var head=[nk[0]+tx/tl*14, nk[1]+ty/tl*14];
  var arms=[0,1].map(function(i){ return ik(nk,pose.h[i],L.ua,L.fa,eb[i]); });
  var legs=[0,1].map(function(i){ return ik(hip,pose.f[i],L.th,L.sh,kb[i]); });
  var g="";
  // glow layer
  var gl="";
  if(on("legs")||on("glutes")){ legs.forEach(function(l,i){ if(on("legs")||i===0||!side){ gl+=ln(hip,l[0],14,GLOW); if(on("legs")) gl+=ln(l[0],l[1],12,GLOW);} }); }
  if(on("glutes")) gl+='<circle cx="'+hip[0].toFixed(1)+'" cy="'+hip[1].toFixed(1)+'" r="11" fill="'+GLOW+'"/>';
  if(on("core")||on("back")) gl+=ln(hip,nk,16,GLOW);
  if(on("arms")) arms.forEach(function(a,i){ if(i===0||!side){ gl+=ln(nk,a[0],12,GLOW)+ln(a[0],a[1],11,GLOW);} });
  if(on("shoulders")) gl+='<circle cx="'+nk[0].toFixed(1)+'" cy="'+nk[1].toFixed(1)+'" r="10" fill="'+GLOW+'"/>';
  if(gl) g+='<g opacity=".55" filter="url(#gl)">'+gl+'</g>';
  var farC = side ? FAR : INK;
  // far limbs
  g+=ln(hip,legs[1][0],8,farC)+ln(legs[1][0],legs[1][1],7,farC);
  g+=ln(nk,arms[1][0],7,farC)+ln(arms[1][0],arms[1][1],6,farC);
  // body
  g+=ln(hip,nk,10,INK);
  g+='<circle cx="'+head[0].toFixed(1)+'" cy="'+head[1].toFixed(1)+'" r="10" fill="'+INK+'"/>';
  // near limbs
  g+=ln(hip,legs[0][0],8,INK)+ln(legs[0][0],legs[0][1],7,INK);
  g+=ln(nk,arms[0][0],7,INK)+ln(arms[0][0],arms[0][1],6,INK);
  return g;
}
function scene(ex){
  var s='<defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs>';
  if(ex.view!=="top") s+='<line x1="-200" y1="144" x2="440" y2="144" stroke="#DDD6DC" stroke-width="2"/>';
  if(ex.prop==="step") s+='<rect x="18" y="113" width="52" height="31" rx="3" fill="#D9D1D8"/>';
  return s;
}
function vb(ex){
  if(ex._vb) return ex._vb;
  var xs=[], ys=[];
  ex.keys.forEach(function(k){ [k.hip,k.neck,k.h[0],k.h[1],k.f[0],k.f[1]].forEach(function(p){ xs.push(p[0]); ys.push(p[1]); });
    var tx=k.neck[0]-k.hip[0], ty=k.neck[1]-k.hip[1], tl=Math.hypot(tx,ty)||1; xs.push(k.neck[0]+tx/tl*24); ys.push(k.neck[1]+ty/tl*24); });
  var pad=26, x0=Math.min.apply(null,xs)-pad, x1=Math.max.apply(null,xs)+pad, y0=Math.min.apply(null,ys)-pad, y1=Math.max.apply(null,ys)+pad;
  var R=240/172, floor=ex.view!=="top";
  if(floor) y1=152;
  var w=Math.max(x1-x0,150), h=Math.max(y1-y0, w/R); w=Math.max(w, h*R); h=w/R;
  var cx=(x0+x1)/2, cy=(y0+y1)/2, top=floor ? 152-h : cy-h/2;
  return (ex._vb=(cx-w/2).toFixed(1)+" "+top.toFixed(1)+" "+w.toFixed(1)+" "+h.toFixed(1));
}
function svgFig(ex,s,id){
  return '<svg viewBox="'+vb(ex)+'" role="img" aria-label="'+ex.name+' demonstration">'+scene(ex)+'<g id="'+(id||'')+'">'+figure(ex,poseAt(ex,s))+'</g></svg>';
}
function thumb(ex){
  return '<svg viewBox="'+vb(ex)+'" aria-hidden="true">'+(ex.view!=="top"?'<line x1="-200" y1="144" x2="440" y2="144" stroke="#3A3C44" stroke-width="3"/>':'')+
    (ex.prop==="step"?'<rect x="18" y="113" width="52" height="31" rx="3" fill="#3A3C44"/>':'')+
    figure(ex,poseAt(ex,ex.keys.length===3?0.5:1)).replace(new RegExp(INK,"g"),"#E9E7EC").replace(new RegExp(FAR,"g"),"#6E7280").replace(/<g opacity="\.55" filter="url\(#gl\)">.*?<\/g>/,"")+'</svg>';
}

var anim=null;
function startAnim(ex){
  stopAnim();
  var el=document.getElementById("fig"); if(!el) return;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var period = ex.hold ? 3600 : 2600;
  function frame(ts){
    var c=(1-Math.cos(ts/period*2*Math.PI))/2;
    var s=Math.max(0,Math.min(1,(c-0.08)/0.84));
    s = s*s*(3-2*s);
    el.innerHTML=figure(ex,poseAt(ex,s));
    anim=requestAnimationFrame(frame);
  }
  if(reduce){ el.innerHTML=figure(ex,poseAt(ex,1)); return; }
  anim=requestAnimationFrame(frame);
}
function stopAnim(){ if(anim){ cancelAnimationFrame(anim); anim=null; } }

    else { var old=localStorage.getItem("bloom-v1"); if(old){ var o=JSON.parse(old); db.done=o.done||{}; db.checks=o.checks||{}; save(); } }
  }catch(e){}
}

/* ===== Dates & stats ===== */
function pad(n){ return (n<10?"0":"")+n; }
function dk(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function mid(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function add(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function monday(d){ var x=mid(d), g=x.getDay(); return add(x, g===0?-6:1-g); }

function nice(k){ return parseK(k).toLocaleDateString(undefined,{day:"numeric", month:"short"}); }
function streak(){
  var d=mid(new Date()), n=0;
  for(var i=0;i<500;i++){
    var g=d.getDay();
    if(db.done[dk(d)]) n++;
    else if(!(i===0||g===0||g===6)) break;
    d=add(d,-1);
  }
  return n;
}
function total(){ return Object.keys(db.done).length; }
function wsorted(){ return db.weights.slice().sort(function(a,b){ return a.d<b.d?-1:1; }); }
function fmt(s){ var m=Math.floor(s/60); return m+":"+pad(s%60); }
function lbl(s){ return s>=60&&s%60===0 ? (s/60)+" min" : s<60 ? s+" sec" : fmt(s); }

function chart(ws){
  var pts=ws.slice(-20), W=320, H=160, L=34, R=10, T=12, B=26;
  var vals=pts.map(function(w){return w.kg;}), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx-mn<1){ mn-=0.5; mx+=0.5; } var pad2=(mx-mn)*0.15; mn-=pad2; mx+=pad2;
  var t0=parseK(pts[0].d).getTime(), t1=parseK(pts[pts.length-1].d).getTime(), span=Math.max(1,t1-t0);
  function X(w){ return L+(parseK(w.d).getTime()-t0)/span*(W-L-R); }

  var line=pts.map(function(w){return X(w).toFixed(1)+","+Y(w.kg).toFixed(1);}).join(" ");
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight over time">';
  [mx-pad2, (mx+mn)/2, mn+pad2].forEach(function(v){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#2A2C33"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" fill="#8B909A" font-size="10" text-anchor="end" font-family="monospace">'+kg(v)+'</text>'; });
  s+='<polyline points="'+line+'" fill="none" stroke="#FF4D8D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(w){ s+='<circle cx="'+X(w).toFixed(1)+'" cy="'+Y(w.kg).toFixed(1)+'" r="3.5" fill="#FF4D8D"/>'; });
  s+='<text x="'+L+'" y="'+(H-6)+'" fill="#8B909A" font-size="10">'+nice(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" fill="#8B909A" font-size="10" text-anchor="end">'+nice(pts[pts.length-1].d)+'</text>';
  return s+'</svg>';
}

/* ----- Render ----- */
function render(){
  stopAnim();
  var s=state.screen, h;
  if(s && s.k==="day") h=vDay(s.g);
  else if(s && s.k==="ex") h=vEx(s.g,s.i);
  else h={today:vToday, week:vWeek, weight:vWeight}[state.tab]();
  app.innerHTML=h;
  nav.innerHTML=[["today","Today"],["week","Week"],["weight","Weight"]].map(function(t){
    return '<button data-a="tab" data-t="'+t[0]+'"'+(state.tab===t[0]?' aria-current="page"':'')+'>'+IC[t[0]]+t[1]+'</button>';
  }).join("");
  if(s && s.k==="ex") startAnim(EX[PLAN[s.g].items[s.i].id]);
}
function go(screen){ state.screen=screen; render(); window.scrollTo(0,0); }

/* ===== Timer ===== */
var tEl=document.getElementById("timer"), T=null;
function openTimer(sec,label){
  closeTimer(); T={total:sec,left:sec,label:label,run:true,end:Date.now()+sec*1000,fin:false};
  T.iv=setInterval(tick,250); tEl.hidden=false; drawT();
}
function tick(){
  if(!T||!T.run) return;
  var l=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  if(l!==T.left){ T.left=l; drawT(); }
  if(l===0){ T.run=false; T.fin=true; clearInterval(T.iv); buzz(); drawT(); }
}
function buzz(){
  try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,250]); }catch(e){}
  try{ var A=window.AudioContext||window.webkitAudioContext; if(!A) return; var x=new A();
    [0,.3,.6].forEach(function(t){ var o=x.createOscillator(), g=x.createGain(); o.frequency.value=880; o.connect(g); g.connect(x.destination);
      g.gain.setValueAtTime(.0001,x.currentTime+t); g.gain.exponentialRampToValueAtTime(.3,x.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,x.currentTime+t+.22);
      o.start(x.currentTime+t); o.stop(x.currentTime+t+.25); }); }catch(e){}
}
function drawT(){
  if(!T) return;
  var r=46, c=2*Math.PI*r, off=c*(1-T.left/T.total);
  tEl.innerHTML='<p class="tl">'+T.label+'</p><div class="tring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="#1F2026" stroke-width="6"/><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="#FF4D8D" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/></svg><div class="num">'+fmt(T.left)+'</div></div>'+
    '<p class="msg" aria-live="polite">'+(T.fin?'Time\u2019s up!':'')+'</p><div class="tb">'+
    (T.fin?'<button data-t="again">Again</button><button class="p" data-t="close">Done</button>'
          :'<button data-t="add">+15 sec</button><button data-t="pause">'+(T.run?'Pause':'Resume')+'</button><button class="p" data-t="close">Close</button>')+'</div>';
}
function closeTimer(){ if(T){ clearInterval(T.iv); T=null; } tEl.hidden=true; tEl.innerHTML=""; }
tEl.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-t]"); if(!b||!T) return; var a=b.getAttribute("data-t");
  if(a==="close") closeTimer();
  else if(a==="again") openTimer(T.total,T.label);
  else if(a==="add"){ T.left+=15; T.total+=15; if(T.run) T.end+=15000; drawT(); }
  else if(a==="pause"){ if(T.run){ T.run=false; T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000)); } else { T.run=true; T.end=Date.now()+T.left*1000; } drawT(); }
});

/* ===== Events ===== */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]"); if(!b) return;
  var a=b.getAttribute("data-a"), g=+b.getAttribute("data-g"), i=+b.getAttribute("data-i");
  if(a==="tab"){ state.tab=b.getAttribute("data-t"); go(null); }
  else if(a==="home"){ go(null); }
  else if(a==="day"){ go({k:"day", g:g}); }
  else if(a==="ex"){ go({k:"ex", g:g, i:i}); }
  else if(a==="tick"){
    var k=dk(new Date()), c=db.checks[k]||(db.checks[k]={}), p=PLAN[todayG()];
    if(c[i]) delete c[i]; else c[i]=true;
    if(p.items && p.items.every(function(_,j){return c[j];})) db.done[k]=true;
    save();
    if(b.getAttribute("data-next") && i<p.items.length-1) go({k:"ex", g:todayG(), i:i+1});
    else if(b.getAttribute("data-next")) go({k:"day", g:todayG()});
    else render();
  }
  else if(a==="finish"){ var k2=dk(new Date()); if(db.done[k2]) delete db.done[k2]; else db.done[k2]=true; save(); render(); }
  else if(a==="timer"){ openTimer(+b.getAttribute("data-s"), b.getAttribute("data-l")); }
  else if(a==="saveW"){
    var inp=document.getElementById("wIn"), v=parseFloat(String(inp.value).replace(",","."));
    if(!(v>=20 && v<=300)){ inp.focus(); inp.style.borderColor="#FF4D8D"; inp.placeholder="Enter kg, e.g. 55.5"; return; }
    var today=dk(new Date());
    db.weights=db.weights.filter(function(w){return w.d!==today;}); db.weights.push({d:today, kg:Math.round(v*10)/10}); save(); render();
  }
  else if(a==="delW"){ var d=b.getAttribute("data-d"); if(confirm("Delete the weight for "+nice(d)+"?")){ db.weights=db.weights.filter(function(w){return w.d!==d;}); save(); render(); } }
  else if(a==="closeios"){ iosHintClosed=true; render(); }
  else if(a==="install" && installEvt){ installEvt.prompt(); installEvt.userChoice.then(function(){ installEvt=null; render(); }); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target && e.target.id==="wIn"){ var s=document.querySelector('[data-a="saveW"]'); if(s) s.click(); }
  if(e.key==="Escape" && T) closeTimer();
});
window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); installEvt=e; if(!state.screen) render(); });
window.addEventListener("appinstalled",function(){ installEvt=null; render(); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden && !T && !state.screen) render(); });

if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("service-worker.js").catch(function(){}); }); }

load(); render();
})();
</script>
</body>
</html>
