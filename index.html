<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloom">
<title>Bloom</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4F6; --surface:#FFFFFF; --ink:#2A1730; --muted:#7D6A80; --line:#F0DAE2;
  --rose:#D6336C; --rose-ink:#FFFFFF; --rose-soft:#FFE1EB;
  --sage:#4F806A; --sage-soft:#E1EFE7;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1220; --surface:#281A2D; --ink:#F7E9EF; --muted:#B39CB7; --line:#3B2942;
    --rose:#FF6B9A; --rose-ink:#2A0F1B; --rose-soft:#46203A;
    --sage:#8CC4A8; --sage-soft:#1F3429;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
button:focus-visible{outline:3px solid var(--rose); outline-offset:2px; border-radius:10px}
h1,h2,h3{font-family:var(--display); margin:0; line-height:1.1; font-weight:700}
p{margin:0}

.app{max-width:560px; margin:0 auto; padding:0 18px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex; align-items:center; justify-content:space-between; padding:16px 0 8px}
.mark{font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px}
.mark svg{width:22px; height:22px}
.top-right{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px}
.install{background:var(--rose-soft); color:var(--rose); font-weight:700; font-size:13px; padding:6px 12px; border-radius:999px}

/* Today hero */
.hero{padding:18px 0 22px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center}
.hero .day{color:var(--muted); font-weight:600}
.hero h1{font-size:clamp(30px,8.5vw,40px); letter-spacing:-.02em; margin:4px 0 8px}
.hero .focus{color:var(--muted)}
.ring{width:96px; height:96px; position:relative}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .track{stroke:var(--rose-soft)}
.ring .fill{stroke:var(--rose); transition:stroke-dashoffset .5s ease}
.ring .count{position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-family:var(--display); font-weight:700; font-size:22px; line-height:1}
.ring .count small{display:block; font-family:var(--body); font-weight:600; font-size:11px; color:var(--muted); margin-top:3px}
.hero.recovery .ring .track{stroke:var(--sage-soft)}
.hero.recovery .ring .fill{stroke:var(--sage)}

.phase{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:18px; font-size:15px}
.phase strong{font-family:var(--display)}

.block{margin:22px 0}
.block > h2{font-size:19px; margin-bottom:10px}
.note{color:var(--muted); font-size:15px; margin:-4px 0 12px}

/* exercise list */
.list{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden}
.ex + .ex{border-top:1px solid var(--line)}
.ex-main{display:flex; align-items:center; gap:4px; padding:4px 6px 4px 12px}
.check{flex:none; width:44px; height:44px; display:grid; place-items:center; border-radius:50%}
.check span{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; transition:background .2s, border-color .2s}
.check svg{width:14px; height:14px; opacity:0}
.ex.is-done .check span{background:var(--rose); border-color:var(--rose)}
.ex.is-done .check svg{opacity:1; color:var(--rose-ink)}
.ex-body{flex:1; display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; padding:12px 6px; min-height:48px}
.ex-name{font-weight:700}
.ex.is-done .ex-name{color:var(--muted); text-decoration:line-through; text-decoration-thickness:1.5px}
.ex-dose{color:var(--muted); font-size:14px; white-space:nowrap; display:flex; align-items:center; gap:6px}
.ex-dose svg{width:16px; height:16px; transition:transform .2s}
.ex-body[aria-expanded="true"] .ex-dose svg{transform:rotate(180deg)}
.ex-detail{padding:2px 18px 18px 62px; font-size:15px}
.ex-works{color:var(--rose); font-weight:700; font-size:14px; margin-bottom:8px}
.ex-detail ol{margin:0 0 4px; padding-left:20px}
.ex-detail li{margin-bottom:6px}
.ex-tip{background:var(--rose-soft); border-radius:12px; padding:10px 12px; margin:10px 0 4px; font-size:14px}
.no-check .ex-main{padding-left:6px}
.no-check .ex-detail{padding-left:18px}

.btn{display:block; width:100%; padding:16px; border-radius:16px; font-weight:700; text-align:center; font-size:16px}
.btn-main{background:var(--rose); color:var(--rose-ink)}
.btn-done{background:var(--sage-soft); color:var(--sage)}
.btn-soft{display:inline-flex; align-items:center; gap:8px; background:var(--rose-soft); color:var(--rose); font-weight:700; font-size:14px; padding:9px 14px; border-radius:999px; margin-top:10px}
.btn-soft svg{width:16px; height:16px}

.rest-row{display:flex; gap:8px; flex-wrap:wrap}
.rest-row .btn-soft{margin:0}

/* rest day */
.rest-card{background:var(--sage-soft); color:var(--ink); border-radius:22px; padding:24px 20px; margin:6px 0 18px}
.rest-card h1{font-size:34px; margin-bottom:8px}
.rest-card p{color:var(--ink); opacity:.85}

/* week view */
.week{display:flex; flex-direction:column; gap:10px}
.wday{background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden}
.wday.today{border-color:var(--rose)}
.wday-head{width:100%; display:flex; align-items:center; gap:14px; padding:14px 16px; text-align:left}
.wday-dot{flex:none; width:12px; height:12px; border-radius:50%; background:var(--rose)}
.wday-dot.recovery{background:var(--sage)}
.wday-dot.rest{background:transparent; border:2px solid var(--muted)}
.wday-text{flex:1; min-width:0}
.wday-name{font-size:14px; color:var(--muted); font-weight:600}
.wday-name b{color:var(--rose); margin-left:6px}
.wday-title{font-family:var(--display); font-weight:700; font-size:18px; line-height:1.2}
.wday-head svg{width:18px; height:18px; color:var(--muted); transition:transform .2s; flex:none}
.wday-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.wday .list{border:0; border-top:1px solid var(--line); border-radius:0}

/* guide */
.prose{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 18px}
.prose p + p{margin-top:10px}
.prose ul{margin:6px 0 0; padding-left:20px}
.prose li{margin-bottom:6px}
.times{width:100%; border-collapse:collapse; font-size:15px}
.times td{padding:9px 0; border-bottom:1px solid var(--line)}
.times td:last-child{text-align:right; font-weight:700}
.times tr:last-child td{border-bottom:0; font-family:var(--display); font-size:17px}
.steps{list-style:none; margin:0; padding:0; counter-reset:s}
.steps li{position:relative; padding:0 0 16px 40px}
.steps li:last-child{padding-bottom:0}
.steps li::before{counter-increment:s; content:counter(s); position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--rose-soft); color:var(--rose); font-weight:700; display:grid; place-items:center; font-size:14px}
.steps li.now::before{background:var(--rose); color:var(--rose-ink)}
.steps b{display:block; font-family:var(--display)}

/* progress */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 10px; text-align:center}
.stat b{display:block; font-family:var(--display); font-size:30px; line-height:1.1}
.stat span{font-size:13px; color:var(--muted)}
.stat.lead b{color:var(--rose)}
.grid-wrap{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; overflow-x:auto}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; min-width:260px}
.cal .h{font-size:12px; color:var(--muted); text-align:center; font-weight:600}
.cal .c{aspect-ratio:1; border-radius:50%; background:var(--bg); border:1px solid var(--line)}
.cal .c.done{background:var(--rose); border-color:var(--rose)}
.cal .c.today{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--rose)}
.cal .c.future{opacity:.35}
.legend{display:flex; gap:14px; font-size:13px; color:var(--muted); margin-top:12px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--rose); margin-right:6px; vertical-align:middle}
.reset{color:var(--muted); font-size:14px; text-decoration:underline; margin-top:24px; display:block}

/* nav */
.nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:5}
.nav-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.nav button{display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0 12px; font-size:12px; font-weight:700; color:var(--muted)}
.nav svg{width:22px; height:22px}
.nav button[aria-current="page"]{color:var(--rose)}

/* timer */
.timer{position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); text-align:center}
.timer[hidden]{display:none}
.timer .label{color:var(--muted); font-weight:700; margin-bottom:18px}
.tring{width:min(70vw,280px); aspect-ratio:1; position:relative}
.tring svg{width:100%; height:100%; transform:rotate(-90deg)}
.tring .track{stroke:var(--rose-soft)}
.tring .fill{stroke:var(--rose)}
.tring .num{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:clamp(48px,16vw,72px); letter-spacing:-.02em}
.timer .done-msg{color:var(--rose); font-weight:700; margin-top:14px; min-height:24px}
.tbtns{display:flex; gap:10px; margin-top:20px; width:100%; max-width:360px}
.tbtns button{flex:1; padding:15px; border-radius:16px; font-weight:700; background:var(--rose-soft); color:var(--rose)}
.tbtns button.primary{background:var(--rose); color:var(--rose-ink)}

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" aria-label="Main"><div class="nav-in" id="nav"></div></nav>
<div class="timer" id="timer" hidden role="dialog" aria-modal="true" aria-label="Timer"></div>

<script>
(function(){
"use strict";

/* ---------- Exercise library ---------- */
var EX = {
  glute_bridge:{name:"Glute bridge", works:"Glutes, hamstrings", steps:[
    "Lie on your back, knees bent, feet flat and hip-width apart.",
    "Press through your heels and lift your hips until your body is a straight line from shoulders to knees.",
    "Squeeze your glutes hard at the top.",
    "Lower slowly. Keep your ribs down so your lower back doesn\u2019t arch."]},
  glute_bridge_squeeze:{name:"Glute bridge, 2-second squeeze", works:"Glutes, hamstrings", steps:[
    "Lie on your back, knees bent, feet flat and hip-width apart.",
    "Press through your heels and lift your hips.",
    "Hold at the top and squeeze your glutes for a full 2 seconds.",
    "Lower slowly and repeat. Keep your lower back from arching."]},
  bw_squat:{name:"Bodyweight squat", works:"Glutes, quads", steps:[
    "Stand with feet just wider than your hips, toes turned out slightly.",
    "Sit your hips back and down as if onto a chair, chest up.",
    "Go as low as is comfortable with heels down and knees following your toes.",
    "Push through your whole foot to stand, squeezing your glutes at the top."]},
  reverse_lunge:{name:"Reverse lunge", works:"Glutes, quads, hamstrings", steps:[
    "Stand tall with feet hip-width apart.",
    "Step one foot back and lower until both knees bend to about 90\u00b0.",
    "Keep most of your weight in the front heel.",
    "Push through the front foot to come back up. Finish one side, then switch."]},
  sl_glute_bridge:{name:"Single-leg glute bridge", works:"Glutes, hamstrings", steps:[
    "Lie on your back with one foot flat and the other leg straight in the air.",
    "Press through the planted heel to lift your hips.",
    "Keep your hips level so one side doesn\u2019t drop.",
    "Lower slowly. Finish one side, then switch."]},
  donkey_kick:{name:"Donkey kick", works:"Glutes", steps:[
    "Start on hands and knees: hands under shoulders, knees under hips.",
    "Keeping the knee bent at 90\u00b0, lift one foot toward the ceiling.",
    "Stop when your thigh lines up with your body. Don\u2019t arch your back.",
    "Squeeze at the top, then lower with control."]},
  fire_hydrant:{name:"Fire hydrant", works:"Side glutes", steps:[
    "Start on hands and knees with a flat back.",
    "Keeping the knee bent, lift one leg out to the side.",
    "Lift only as high as you can without tipping your hips.",
    "Pause at the top, then lower slowly."]},
  dead_bug:{name:"Dead bug", works:"Deep core", steps:[
    "Lie on your back, arms reaching to the ceiling, knees bent at 90\u00b0 over your hips.",
    "Press your lower back gently into the floor.",
    "Breathe out as you slowly lower the opposite arm and leg toward the floor.",
    "Return and switch sides. Your lower back stays down throughout."]},
  forearm_plank:{name:"Forearm plank", works:"Core, shoulders", steps:[
    "Forearms on the floor with elbows under your shoulders.",
    "Step your feet back so your body is straight from head to heels. Drop to your knees to make it easier.",
    "Squeeze your glutes and gently pull your belly in.",
    "Breathe steadily. Stop when your hips start to sag."]},
  reverse_crunch:{name:"Reverse crunch", works:"Lower abs", steps:[
    "Lie on your back, knees bent at 90\u00b0, hands by your sides.",
    "Breathe out and curl your hips off the floor, bringing your knees toward your chest.",
    "Use your abs rather than swinging.",
    "Lower slowly until your feet nearly touch the floor."]},
  knee_pushup:{name:"Knee push-up", works:"Chest, arms, shoulders", steps:[
    "Hands slightly wider than your shoulders, knees down, body straight from head to knees.",
    "Lower your chest toward the floor, elbows angled back at about 45\u00b0.",
    "Push the floor away to come back up.",
    "Keep your hips in line, not raised or sagging."]},
  arm_circles:{name:"Arm circles", works:"Shoulders, arms", steps:[
    "Stand tall with arms straight out to the sides.",
    "Make small, controlled circles forward.",
    "Let them grow slightly bigger as you go.",
    "Do the time forward, then the same backward."]},
  shoulder_taps:{name:"Shoulder taps", works:"Core, shoulders, arms", steps:[
    "Start in a high plank on your hands, or on your knees to make it easier.",
    "Set your feet wide for balance.",
    "Lift one hand and tap the opposite shoulder.",
    "Keep your hips as still as you can. Alternate sides."]},
  brisk_walk:{name:"Brisk walk or march in place", works:"Heart, legs", steps:[
    "Walk at a pace where you can talk but not sing.",
    "Swing your arms naturally.",
    "Indoors, march in place and lift your knees to a comfortable height.",
    "Keep it steady rather than hard."]},
  side_steps:{name:"Standing side steps", works:"Hips, legs", steps:[
    "Stand with knees soft and a slight bend at the hips.",
    "Step to the side and bring the other foot in.",
    "Take 3\u20134 steps one way, then come back.",
    "Keep a light, steady rhythm."]},
  hip_flexor:{name:"Hip-flexor stretch", works:"Front of hips", steps:[
    "Kneel on one knee with the other foot flat in front of you.",
    "Tuck your tailbone under slightly and squeeze the glute of the back leg.",
    "Shift gently forward until you feel a stretch at the front of the back hip.",
    "Hold, breathe, then switch sides."]},
  childs_pose:{name:"Child\u2019s pose", works:"Back, hips", steps:[
    "Kneel and sit back toward your heels.",
    "Walk your hands forward and rest your forehead down.",
    "Let your back and shoulders soften.",
    "Breathe slowly into your back."]},
  full_stretch:{name:"Gentle full-body stretch", works:"Whole body", steps:[
    "Reach your arms overhead and stretch tall.",
    "Gently stretch your hamstrings, thighs and chest.",
    "Hold each stretch for 20\u201330 seconds.",
    "No bouncing, and never stretch into pain."]},
  bulgarian:{name:"Bulgarian split squat", works:"Glutes, quads", steps:[
    "Stand in front of a stable, low step and rest the top of one foot on it behind you.",
    "Lower straight down until your front thigh is close to level with the floor.",
    "Lean your chest forward a little to work the glutes more.",
    "Push through your front heel to rise. Finish one side, then switch."]},
  sl_rdl:{name:"Single-leg Romanian deadlift", works:"Hamstrings, glutes, balance", steps:[
    "Stand on one leg with a soft bend in the knee.",
    "Hinge at the hips and reach your hands down while the other leg extends behind you.",
    "Keep your back flat and your hips level.",
    "Squeeze your glute to stand back up. Hold a wall for balance if you need to."]},
  frog_pumps:{name:"Frog pumps", works:"Glutes", steps:[
    "Lie on your back with the soles of your feet together and knees falling out.",
    "Pull your heels in close to your hips.",
    "Squeeze your glutes to lift your hips, then lower.",
    "Keep the reps quick but controlled."]},
  bird_dog:{name:"Bird dog", works:"Core, lower back, glutes", steps:[
    "Start on hands and knees with a flat back.",
    "Reach one arm forward and the opposite leg back at the same time.",
    "Keep your hips square, as if balancing a cup on your lower back.",
    "Pause, come back, and switch sides."]},
  side_plank_knees:{name:"Side plank from knees", works:"Side abs", steps:[
    "Lie on your side with your elbow under your shoulder and knees bent behind you.",
    "Lift your hips so your body is straight from head to knees.",
    "Don\u2019t let your hips sink.",
    "Hold, then switch sides."]},
  prone_w:{name:"Prone W raise", works:"Upper back, rear shoulders", steps:[
    "Lie face down with your forehead on a folded towel.",
    "Bend your elbows and hold your arms in a W shape.",
    "Squeeze your shoulder blades together and lift your arms slightly.",
    "Hold for a second, then lower slowly."]},
  snow_angel:{name:"Reverse snow angel", works:"Upper back, shoulders", steps:[
    "Lie face down with your arms by your sides, palms down, lifted slightly.",
    "Sweep your arms out and overhead in a wide arc, keeping them off the floor.",
    "Sweep them back down to your sides.",
    "Move slowly and keep your neck relaxed."]},
  walking:{name:"Walk", works:"Heart, legs", steps:[
    "Walk at a comfortable, easy pace.",
    "Pick somewhere pleasant if you can.",
    "This should feel refreshing, not tiring."]},
  mobility:{name:"Gentle mobility or stretching", works:"Whole body", steps:[
    "Hip circles, cat-cow and gentle twists.",
    "Shoulder rolls and slow neck stretches.",
    "Move through a comfortable range only."]}
};

/* ---------- Weekly plan (index = JS getDay, 0 = Sunday) ---------- */
var PLAN = {
  1:{title:"Glutes & hamstrings", focus:"Glute growth", type:"train", items:[
    {id:"glute_bridge", dose:"4 \u00d7 15"},
    {id:"bw_squat", dose:"3 \u00d7 12"},
    {id:"reverse_lunge", dose:"3 \u00d7 10 each leg"},
    {id:"sl_glute_bridge", dose:"2 \u00d7 10 each leg"},
    {id:"donkey_kick", dose:"3 \u00d7 15 each leg"},
    {id:"fire_hydrant", dose:"2 \u00d7 15 each leg"}]},
  2:{title:"Abs & arms", focus:"Core strength and slimmer-looking arms", type:"train", items:[
    {id:"dead_bug", dose:"3 \u00d7 10 each side"},
    {id:"forearm_plank", dose:"3 \u00d7 20\u201340 sec", timer:30},
    {id:"reverse_crunch", dose:"3 \u00d7 12"},
    {id:"knee_pushup", dose:"3 \u00d7 8\u201312"},
    {id:"arm_circles", dose:"2 \u00d7 30 sec each way", timer:30},
    {id:"shoulder_taps", dose:"3 \u00d7 10 each side"}]},
  3:{title:"Cardio & recovery", focus:"Low-impact movement", type:"recovery",
    note:"Keep today comfortable rather than exhausting.", items:[
    {id:"brisk_walk", dose:"20\u201330 min", timer:1500},
    {id:"side_steps", dose:"3 \u00d7 1 min", timer:60},
    {id:"hip_flexor", dose:"30 sec each side", timer:30},
    {id:"childs_pose", dose:"45 sec", timer:45},
    {id:"full_stretch", dose:"5 min", timer:300}]},
  4:{title:"Round & structured glutes", focus:"Glute shape", type:"train", items:[
    {id:"glute_bridge_squeeze", dose:"4 \u00d7 15"},
    {id:"bulgarian", dose:"3 \u00d7 8 each leg", tip:"Only use a stable, low step if it feels safe. Otherwise, do reverse lunges instead."},
    {id:"sl_rdl", dose:"3 \u00d7 10 each leg"},
    {id:"donkey_kick", dose:"3 \u00d7 15 each leg"},
    {id:"fire_hydrant", dose:"3 \u00d7 15 each leg"},
    {id:"frog_pumps", dose:"2 \u00d7 25"}]},
  5:{title:"Abs, arms & back", focus:"Posture and core", type:"train", items:[
    {id:"bird_dog", dose:"3 \u00d7 10 each side"},
    {id:"dead_bug", dose:"3 \u00d7 10 each side"},
    {id:"side_plank_knees", dose:"2 \u00d7 20 sec each side", timer:20},
    {id:"knee_pushup", dose:"3 \u00d7 8\u201312"},
    {id:"prone_w", dose:"3 \u00d7 12"},
    {id:"snow_angel", dose:"2 \u00d7 12"}]},
  6:{title:"Optional active day", focus:"Easy movement", type:"recovery",
    note:"Feeling tired or sore? Take a full rest day instead.", items:[
    {id:"walking", dose:"30\u201345 min", timer:1800},
    {id:"mobility", dose:"10 min", timer:600}]},
  0:{title:"Full rest", type:"rest"}
};
var ORDER = [1,2,3,4,5,6,0];
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

var PHASES = [
  {weeks:"Weeks 1\u20132", title:"Learn the moves", text:"Use the listed reps and focus on correct technique."},
  {weeks:"Weeks 3\u20134", title:"Add a little", text:"Add 2\u20133 reps per set where comfortable, or slow each rep down."},
  {weeks:"Weeks 5\u20138", title:"Make it harder", text:"Move to harder versions, like single-leg bridges and deeper controlled lunges, while keeping good form."}
];

/* ---------- Icons ---------- */
var I = {
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  chev:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>',
  clock:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="11" r="7"/><path d="M10 7.5V11l2.5 1.5M8 2h4"/></svg>',
  flower:'<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="var(--rose)"><ellipse cx="12" cy="6" rx="3.6" ry="5"/><ellipse cx="12" cy="6" rx="3.6" ry="5" transform="rotate(72 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5" transform="rotate(144 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5" transform="rotate(216 12 12)"/><ellipse cx="12" cy="6" rx="3.6" ry="5" transform="rotate(288 12 12)"/></g><circle cx="12" cy="12" r="3" fill="var(--bg)"/></svg>',
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  guide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5z"/><path d="M4 19a2 2 0 012-2h13M9 8h6"/></svg>',
  progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};

/* ---------- Storage ---------- */
var KEY = "bloom-v1";
var db = {start:null, done:{}, checks:{}};
function load(){
  try{ var s = localStorage.getItem(KEY); if(s){ var p = JSON.parse(s); if(p && typeof p === "object"){ db.start=p.start||null; db.done=p.done||{}; db.checks=p.checks||{}; } } }catch(e){}
  if(!db.start){ db.start = dk(new Date()); save(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

/* ---------- Dates ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function dk(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d,n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ var x = midnight(d); var g = x.getDay(); return addDays(x, g===0 ? -6 : 1-g); }
function programWeek(){
  var s = db.start.split("-"); var start = new Date(+s[0], +s[1]-1, +s[2]);
  var diff = Math.round((midnight(new Date()) - start)/86400000);
  return Math.max(1, Math.floor(diff/7)+1);
}
function phaseIndex(w){ return w<=2 ? 0 : w<=4 ? 1 : 2; }
function fmt(sec){ var m = Math.floor(sec/60), s = sec%60; return m+":"+pad(s); }
function fmtLabel(sec){ return sec>=60 && sec%60===0 ? (sec/60)+" min" : sec<60 ? sec+" sec" : fmt(sec); }

/* ---------- Stats ---------- */
function streak(){
  var d = midnight(new Date()), n = 0;
  for(var i=0;i<500;i++){
    var k = dk(d), g = d.getDay();
    if(db.done[k]) n++;
    else if(i===0 || g===0 || g===6){ /* today not done yet, or weekend: doesn't break it */ }
    else break;
    d = addDays(d,-1);
  }
  return n;
}
function totalSessions(){ return Object.keys(db.done).filter(function(k){return db.done[k];}).length; }
function weekCount(){
  var m = mondayOf(new Date()), n = 0;
  for(var i=0;i<7;i++){ if(db.done[dk(addDays(m,i))]) n++; }
  return n;
}

/* ---------- State ---------- */
var state = {tab:"today", open:null, weekOpen:null};
var deferredInstall = null;

/* ---------- Rendering ---------- */
var app = document.getElementById("app");
var nav = document.getElementById("nav");

function header(){
  var now = new Date();
  var dstr = now.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
  return '<header class="top"><div class="mark">'+I.flower+'Bloom</div><div class="top-right">'+
    (deferredInstall ? '<button class="install" data-act="install">Install app</button>' : '')+
    '<span>'+dstr+'</span></div></header>';
}

function exRow(it, idx, opts){
  var e = EX[it.id], key = opts.prefix+idx, open = state.open===key, done = !!opts.checked;
  var h = '<li class="ex'+(done?' is-done':'')+'"><div class="ex-main">';
  if(opts.checkable){
    h += '<button class="check" data-act="check" data-i="'+idx+'" aria-pressed="'+done+'" aria-label="'+(done?'Unmark ':'Mark ')+e.name+' as done"><span>'+I.check+'</span></button>';
  }
  h += '<button class="ex-body" data-act="open" data-k="'+key+'" aria-expanded="'+open+'"><span class="ex-name">'+e.name+'</span><span class="ex-dose">'+it.dose+I.chev+'</span></button></div>';
  if(open){
    h += '<div class="ex-detail"><p class="ex-works">Works: '+e.works+'</p><ol>';
    e.steps.forEach(function(s){ h += '<li>'+s+'</li>'; });
    h += '</ol>';
    if(it.tip) h += '<p class="ex-tip">'+it.tip+'</p>';
    if(it.timer) h += '<button class="btn-soft" data-act="timer" data-s="'+it.timer+'" data-l="'+e.name+'">'+I.clock+'Start '+fmtLabel(it.timer)+' timer</button>';
    h += '</div>';
  }
  return h + '</li>';
}

function ring(done,total,cls){
  var r = 40, c = 2*Math.PI*r, off = total ? c*(1-done/total) : c;
  return '<div class="ring '+(cls||'')+'" role="img" aria-label="'+done+' of '+total+' exercises done"><svg viewBox="0 0 96 96"><circle class="track" cx="48" cy="48" r="'+r+'" fill="none" stroke-width="9"/><circle class="fill" cx="48" cy="48" r="'+r+'" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/></svg><div class="count"><div>'+done+'/'+total+'<small>done</small></div></div></div>';
}

function renderToday(){
  var now = new Date(), g = now.getDay(), p = PLAN[g], key = dk(now);
  var w = programWeek(), ph = PHASES[phaseIndex(w)];
  var h = header();

  if(p.type==="rest"){
    h += '<div class="rest-card"><h1>Rest day</h1><p>Rest, recover, eat well and get good sleep. Muscles grow stronger while you recover, not while you train.</p></div>';
    h += '<div class="phase"><strong>Tomorrow:</strong> '+PLAN[1].title+'</div>';
    return h;
  }

  var checks = db.checks[key] || {};
  var total = p.items.length, done = p.items.filter(function(_,i){ return checks[i]; }).length;
  var rec = p.type==="recovery";

  h += '<section class="hero'+(rec?' recovery':'')+'"><div><p class="day">'+DAYS[g]+'</p><h1>'+p.title+'</h1><p class="focus">'+p.focus+'</p></div>'+ring(done,total)+'</section>';

  if(!rec){
    h += '<div class="phase"><strong>Week '+w+(w>8?'':' of 8')+'.</strong> '+(w>8?'Keep progressing with harder variations, or add light resistance like a band or filled water bottles.':ph.text)+'</div>';
  }

  h += '<section class="block"><h2>Warm-up, 5 min</h2><p class="note">March in place, then hip circles, then arm circles.</p><button class="btn-soft" data-act="timer" data-s="300" data-l="Warm-up" style="margin-top:0">'+I.clock+'Start 5:00 warm-up</button></section>';

  h += '<section class="block"><h2>'+(rec?'Today\u2019s movement':'Workout')+'</h2>';
  if(p.note) h += '<p class="note">'+p.note+'</p>';
  else h += '<p class="note">Tap an exercise to see how to do it. Tap the circle when you\u2019ve finished all its sets.</p>';
  h += '<ul class="list">';
  p.items.forEach(function(it,i){ h += exRow(it,i,{checkable:true, checked:checks[i], prefix:"t"}); });
  h += '</ul></section>';

  if(!rec){
    h += '<section class="block"><h2>Rest between sets</h2><div class="rest-row">'+
      [45,60,90].map(function(s){ return '<button class="btn-soft" data-act="timer" data-s="'+s+'" data-l="Rest">'+I.clock+s+' sec</button>'; }).join('')+
      '</div></section>';
  }

  h += '<section class="block"><h2>Cool-down, 5 min</h2><p class="note">Slow stretches for the muscles you just worked.</p></section>';

  var fin = !!db.done[key];
  h += fin
    ? '<button class="btn btn-done" data-act="finish">Workout complete. Tap to undo</button>'
    : '<button class="btn btn-main" data-act="finish">Mark workout complete</button>';
  h += '<p class="note" style="margin-top:14px; text-align:center">Stop if you feel sharp pain, dizziness or unusual discomfort.</p>';
  return h;
}

function renderWeek(){
  var today = new Date().getDay();
  var h = header() + '<section class="block" style="margin-top:12px"><h1 style="font-size:32px; margin-bottom:6px">This week</h1><p class="note" style="margin:0 0 14px">5 workout days, 1 optional active day and 1 full rest day.</p><div class="week">';
  ORDER.forEach(function(g){
    var p = PLAN[g], open = state.weekOpen===g;
    var dot = p.type==="rest" ? "rest" : p.type==="recovery" ? "recovery" : "";
    h += '<div class="wday'+(g===today?' today':'')+'">';
    h += '<button class="wday-head" data-act="wday" data-g="'+g+'" aria-expanded="'+open+'"'+(p.type==="rest"?' disabled':'')+'><span class="wday-dot '+dot+'"></span><span class="wday-text"><span class="wday-name">'+DAYS[g]+(g===today?'<b>Today</b>':'')+'</span><span class="wday-title" style="display:block">'+p.title+'</span></span>'+(p.type==="rest"?'':I.chev)+'</button>';
    if(open && p.items){
      h += '<ul class="list no-check">';
      p.items.forEach(function(it,i){ h += exRow(it,i,{checkable:false, prefix:"w"+g+"-"}); });
      h += '</ul>';
    }
    h += '</div>';
  });
  return h + '</div></section>';
}

function renderGuide(){
  var w = programWeek(), pi = w>8 ? -1 : phaseIndex(w);
  var h = header();
  h += '<section class="block" style="margin-top:12px"><h1 style="font-size:32px; margin-bottom:14px">Your guide</h1></section>';

  h += '<section class="block"><h2>8-week progression</h2><div class="prose"><ol class="steps">';
  PHASES.forEach(function(p,i){ h += '<li'+(i===pi?' class="now"':'')+'><b>'+p.weeks+': '+p.title+(i===pi?' (you\u2019re here)':'')+'</b>'+p.text+'</li>'; });
  h += '</ol></div></section>';

  h += '<section class="block"><h2>How long each workout takes</h2><div class="prose"><table class="times"><tbody>'+
    '<tr><td>Warm-up: marching, hip and arm circles</td><td>5 min</td></tr>'+
    '<tr><td>Main workout</td><td>20\u201330 min</td></tr>'+
    '<tr><td>Cool-down and stretching</td><td>5 min</td></tr>'+
    '<tr><td>Total</td><td>30\u201340 min</td></tr></tbody></table>'+
    '<p style="margin-top:12px">Rest 45\u201390 seconds between sets.</p></div></section>';

  h += '<section class="block"><h2>Getting the results you want</h2><div class="prose"><ul>'+
    '<li><b>Flatter-looking abs:</b> train your core 2\u20133 days a week, walk regularly, eat balanced meals, and look into bloating if it\u2019s a concern.</li>'+
    '<li><b>Round, structured glutes:</b> Monday and Thursday matter most. Use slow reps, a full comfortable range and a strong squeeze at the top of every bridge.</li>'+
    '<li><b>Slimmer-looking arms and thighs:</b> pair full-body activity with gradual fat loss if that\u2019s right for you. No exercise burns fat from just one area.</li>'+
    '<li><b>A toned back:</b> bird dogs, W raises and reverse snow angels strengthen your back and improve posture.</li>'+
    '</ul></div></section>';

  h += '<section class="block"><h2>Food</h2><div class="prose"><p>Include protein like eggs, fish, chicken, dhal and beans, along with vegetables, fruit and enough carbohydrates. There\u2019s no need to starve yourself or train abs every day.</p></div></section>';

  h += '<section class="block"><h2>Good to know</h2><div class="prose"><p>Your abs can get much stronger, but how flat your stomach looks also depends on body fat, genetics, posture, bloating and digestion.</p><p>Bodyweight training is a great start. Once your body adapts, adding resistance, like bands or weights at home, will help you keep building.</p></div></section>';
  return h;
}

function renderProgress(){
  var h = header();
  h += '<section class="block" style="margin-top:12px"><h1 style="font-size:32px; margin-bottom:14px">Progress</h1>';
  h += '<div class="stats"><div class="stat lead"><b>'+streak()+'</b><span>workout streak</span></div><div class="stat"><b>'+weekCount()+'<span style="font-size:16px">/6</span></b><span>this week</span></div><div class="stat"><b>'+totalSessions()+'</b><span>total workouts</span></div></div></section>';

  var todayK = dk(new Date()), mon = mondayOf(new Date());
  var first = addDays(mon, -7*7);
  h += '<section class="block"><h2>Last 8 weeks</h2><div class="grid-wrap"><div class="cal">';
  ["M","T","W","T","F","S","S"].forEach(function(l){ h += '<div class="h">'+l+'</div>'; });
  for(var i=0;i<56;i++){
    var d = addDays(first,i), k = dk(d);
    var cls = "c"+(db.done[k]?" done":"")+(k===todayK?" today":"")+(d>midnight(new Date())?" future":"");
    h += '<div class="'+cls+'" title="'+d.toDateString()+'"></div>';
  }
  h += '</div><div class="legend"><span><i></i>Workout done</span></div></div>';
  h += '<p class="note" style="margin-top:12px">Your streak only counts Monday to Friday. Skipping Saturday or Sunday won\u2019t break it.</p></section>';
  h += '<button class="reset" data-act="reset">Reset all progress</button>';
  return h;
}

function renderNav(){
  var tabs = [["today","Today"],["week","Week"],["guide","Guide"],["progress","Progress"]];
  nav.innerHTML = tabs.map(function(t){
    return '<button data-act="tab" data-t="'+t[0]+'"'+(state.tab===t[0]?' aria-current="page"':'')+'>'+I[t[0]]+t[1]+'</button>';
  }).join('');
}

function render(){
  var fn = {today:renderToday, week:renderWeek, guide:renderGuide, progress:renderProgress}[state.tab];
  app.innerHTML = fn();
  renderNav();
}

/* ---------- Timer ---------- */
var timerEl = document.getElementById("timer");
var T = null;
function openTimer(sec,label){
  closeTimer(true);
  T = {total:sec, left:sec, label:label, running:true, endAt:Date.now()+sec*1000, finished:false};
  T.int = setInterval(tick, 250);
  timerEl.hidden = false;
  drawTimer();
}
function tick(){
  if(!T || !T.running) return;
  var left = Math.max(0, Math.ceil((T.endAt-Date.now())/1000));
  if(left!==T.left){ T.left = left; drawTimer(); }
  if(left===0){ T.running=false; T.finished=true; clearInterval(T.int); alertDone(); drawTimer(); }
}
function alertDone(){
  try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,250]); }catch(e){}
  try{
    var A = window.AudioContext || window.webkitAudioContext; if(!A) return;
    var ctx = new A();
    [0,0.3,0.6].forEach(function(t){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.22);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.25);
    });
  }catch(e){}
}
function drawTimer(){
  if(!T) return;
  var r = 46, c = 2*Math.PI*r, off = c*(1-T.left/T.total);
  timerEl.innerHTML = '<p class="label">'+T.label+'</p>'+
    '<div class="tring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="6"/><circle class="fill" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/></svg><div class="num" aria-live="off">'+fmt(T.left)+'</div></div>'+
    '<p class="done-msg" aria-live="polite">'+(T.finished?'Time\u2019s up':'')+'</p>'+
    '<div class="tbtns">'+
      (T.finished
        ? '<button data-tact="again">Again</button><button class="primary" data-tact="close">Done</button>'
        : '<button data-tact="add">+15 sec</button><button data-tact="toggle">'+(T.running?'Pause':'Resume')+'</button><button class="primary" data-tact="close">Close</button>')+
    '</div>';
}
function closeTimer(silent){
  if(T){ clearInterval(T.int); T = null; }
  timerEl.hidden = true; timerEl.innerHTML = "";
}
timerEl.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-tact]"); if(!b || !T) return;
  var a = b.getAttribute("data-tact");
  if(a==="close") closeTimer();
  else if(a==="again") openTimer(T.total, T.label);
  else if(a==="add"){ T.left += 15; T.total += 15; if(T.running) T.endAt += 15000; drawTimer(); }
  else if(a==="toggle"){
    if(T.running){ T.running=false; T.left = Math.max(0, Math.ceil((T.endAt-Date.now())/1000)); }
    else { T.running=true; T.endAt = Date.now()+T.left*1000; }
    drawTimer();
  }
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && T) closeTimer(); });

/* ---------- Events ---------- */
document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act]"); if(!b) return;
  var a = b.getAttribute("data-act");
  if(a==="tab"){ state.tab = b.getAttribute("data-t"); state.open = null; render(); window.scrollTo(0,0); }
  else if(a==="open"){ var k = b.getAttribute("data-k"); state.open = state.open===k ? null : k; render(); }
  else if(a==="wday"){ var g = +b.getAttribute("data-g"); state.weekOpen = state.weekOpen===g ? null : g; state.open = null; render(); }
  else if(a==="check"){
    var key = dk(new Date()), i = b.getAttribute("data-i");
    var c = db.checks[key] || (db.checks[key] = {});
    if(c[i]) delete c[i]; else c[i] = true;
    var p = PLAN[new Date().getDay()];
    if(p.items && p.items.every(function(_,j){ return c[j]; })) db.done[key] = true;
    save(); render();
  }
  else if(a==="finish"){ var k2 = dk(new Date()); if(db.done[k2]) delete db.done[k2]; else db.done[k2] = true; save(); render(); }
  else if(a==="timer"){ openTimer(+b.getAttribute("data-s"), b.getAttribute("data-l")); }
  else if(a==="reset"){
    if(confirm("Reset all progress? This clears your streak, history and checked exercises.")){
      db = {start:dk(new Date()), done:{}, checks:{}}; save(); render();
    }
  }
  else if(a==="install" && deferredInstall){
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function(){ deferredInstall = null; render(); });
  }
});

window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredInstall = e; render(); });
window.addEventListener("appinstalled", function(){ deferredInstall = null; render(); });

/* Re-render when the app comes back to the front on a new day */
document.addEventListener("visibilitychange", function(){ if(!document.hidden && !T) render(); });

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("service-worker.js").catch(function(){}); });
}

load();
render();
})();
</script>
</body>
